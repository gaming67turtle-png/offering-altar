plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    // Client gametest in src/gametest (run with: gradlew runClientGameTest); not shipped in the jar
    configureTests {
        createSourceSet = true
        modId = 'offering-altar-gametest'
        enableGameTests = false
        // The user agreed to the Minecraft EULA on 2026-10-04 (dedicated server test only)
        eula = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
    it.options.compilerArgs << "-Xlint:deprecation"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
